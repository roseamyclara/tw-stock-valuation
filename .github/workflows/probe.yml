name: 端點探測

# 一次性診斷：實際打過每個候選端點，把可用性與欄位結構印出來。
# 在 Actions 上跑（機房 IP 不會被官方站台的 WAF 擋）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 探測
        working-directory: scripts
        run: python probe.py

      - name: 把報告 commit 回 repo
        if: always()
        run: |
          mkdir -p reports
          mv scripts/probe-report.md reports/probe-report.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/probe-report.md
          git diff --staged --quiet || git commit -m "端點探測報告 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
