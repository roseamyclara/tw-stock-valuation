name: 歷史 P/S 回補
on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconstruct_ps_history.py'
      - '.github/workflows/ps-backfill.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 起始月份
        default: '2013-01'
      end:
        description: 結束月份（留白為原始快照前一個月）
        default: ''
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .ps_backfill_cache
          key: ps-official-history-v1-${{ github.run_id }}
          restore-keys: ps-official-history-v1-
      - name: 驗證日期、歷史股數與12個月營收
        working-directory: scripts
        run: python -m unittest test_reconstruct_ps_history test_ps_history test_revenue
      - name: 重建三市場歷史 P/S
        env:
          START_MONTH: ${{ inputs.start || '2013-01' }}
          END_MONTH: ${{ inputs.end }}
        run: |
          args=(--start "$START_MONTH")
          if [ -n "$END_MONTH" ]; then args+=(--end "$END_MONTH"); fi
          python scripts/reconstruct_ps_history.py "${args[@]}"
      - name: 更新個股歷史圖表
        run: python scripts/rebuild_history.py
      - name: 保存回補資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/ps_reconstructed docs/data/stock docs/data/stock_index.json docs/data/market_history.json
          if ! git diff --staged --quiet; then
            git commit -m '回補三市場歷史 P/S：官方歷史股數與12個月營收'
            git pull --rebase origin main
            git push
          fi
