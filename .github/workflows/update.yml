name: 每日更新

# 台北交易日分批補抓；來源公布時間不一，首輪不代表三市場資料已齊。
# 13:37 首抓、14:37 盤後定價後、15:07 補抓、16:37 興櫃盤後統計、19:23 備援。
# GitHub 排程與資料來源皆可能延遲；避開 :00 / :30。
on:
  schedule:
    - cron: "37 13,14,16 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "7 15 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "23 19 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取並計算最新快照
        working-directory: scripts
        run: python build_snapshot.py

      - name: 每月重建歷史與個股頁
        working-directory: scripts
        run: python rebuild_history.py

      # 集保每週五結算、隔週公布。天天跑無妨：資料日期沒變就只是覆蓋同一筆，
      # 不會在歷史裡多長一週。集保掛掉也不該讓整個更新失敗。
      - name: 集保大戶持股
        working-directory: scripts
        run: python build_tdcc.py
        continue-on-error: true

      - name: commit 資料
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data .endpoint_cache.json
          if git diff --staged --quiet; then
            echo "資料無變化（可能是國定假日），跳過 commit"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi
