name: 每日更新

# 台股交易日收盤後更新。台北 UTC+8，收盤 13:30、盤後資料約 15:00 齊備。
# cron 用 UTC：台北 15:30 = UTC 07:30。週一到週五跑（國定假日會抓到與前一日相同的資料，指令碼會跳過）。
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取並計算最新快照
        working-directory: scripts
        run: python build_snapshot.py

      - name: 每月重建歷史與個股頁
        working-directory: scripts
        run: python rebuild_history.py

      - name: commit 資料
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data .endpoint_cache.json
          if git diff --staged --quiet; then
            echo "資料無變化（可能是國定假日），跳過 commit"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi
